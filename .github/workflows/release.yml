name: Verify and release FluxChain
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fluxchain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: springboot-backend/pom.xml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.4'
          cache-dependency-path: go-gost/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.19.0'
      - name: Check versions and deployment scripts
        run: |
          python3 scripts/check_release.py
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then python3 scripts/check_release.py "$GITHUB_REF_NAME"; fi
          for script in panel_install.sh install.sh build_node.sh vite-frontend/public/udp-echo/install-udp-echo.sh; do bash -n "$script"; done
          bash tests/local-install-smoke.sh
          bash tests/online-install-smoke.sh
          bash tests/network-mode-smoke.sh
      - name: Backend tests
        run: mvn -B -f springboot-backend/pom.xml test
      - name: Frontend production build
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm --dir vite-frontend install --frozen-lockfile
          pnpm --dir vite-frontend run build
      - name: Node probe tests and compile
        working-directory: go-gost
        run: |
          go test x/socket/probe_context.go x/socket/probe_context_test.go x/socket/probe_dispatch.go x/socket/probe_dispatch_test.go -count=1
          go test -mod=readonly github.com/go-gost/x/internal/util/forwardhealth github.com/go-gost/x/internal/util/panelurl github.com/go-gost/x/internal/util/stunprobe github.com/go-gost/x/handler/stunprobe github.com/go-gost/x/connector/relay -count=1
          go test -mod=readonly github.com/go-gost/x/listener/quic -count=1
          (cd ../vite-frontend/udp-echo && go test main.go main_test.go -count=1)
          CGO_ENABLED=0 go build -mod=readonly -trimpath -o /tmp/fluxchain-node .
          cd /tmp
          ./fluxchain-node -V

  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
        include:
          - component: backend
            context: springboot-backend
          - component: frontend
            context: vite-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/toto0912/flux-chain-${{ matrix.component }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/Toto0912/flux-chain
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Also tag with application version (without v)
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          version=$(cat VERSION)
          docker buildx imagetools create --tag "ghcr.io/toto0912/flux-chain-$COMPONENT:$version" "ghcr.io/toto0912/flux-chain-$COMPONENT:$GITHUB_REF_NAME"

  nodes:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.4'
          cache-dependency-path: go-gost/go.sum
      - run: bash build_node.sh amd64 && bash build_node.sh arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nodes
          path: artifacts/gost-linux-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, images, nodes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nodes
          path: artifacts
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package online and offline installers
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          backend="ghcr.io/toto0912/flux-chain-backend:$version"
          frontend="ghcr.io/toto0912/flux-chain-frontend:$version"
          docker pull "$backend"
          docker pull "$frontend"
          docker pull --platform linux/amd64 mysql:5.7
          mkdir -p dist
          docker save mysql:5.7 "$backend" "$frontend" | gzip -1 > "dist/fluxchain-images-amd64-v$version.tar.gz"
          python3 scripts/package_release.py --offline
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Install exported offline package on a clean runner
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          mkdir -p /tmp/fluxchain-install-check
          tar -xzf "dist/fluxchain-offline-amd64-v$version.tar.gz" -C /tmp/fluxchain-install-check
          cd /tmp/fluxchain-install-check
          ipv6_forward_before=$(cat /proc/sys/net/ipv6/conf/all/forwarding)
          printf '16366\n16365\n' | sudo env -u PANEL_IPV6 PANEL_IMAGE_MODE=load bash panel_install.sh install
          test "$(cat /proc/sys/net/ipv6/conf/all/forwarding)" = "$ipv6_forward_before"
          test "$(docker network inspect gost-network --format '{{.EnableIPv6}}')" = false
          cd "$GITHUB_WORKSPACE"
          python3 scripts/verify_install.py
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          python3 scripts/check_release.py "$GITHUB_REF_NAME"
          release_notes=$(cat <<'EOF'
          - **预发布版本（Pre-release）**：本版本为 v1.1.7 候选预发布版，暂不设为 Latest 正式版；正式生产安装仍默认使用 v1.1.6。
          - **节点更新防“更挂”自动回滚**：`install.sh` 更新前先备份旧程序，替换并启动后持续检查服务存活与 `NRestarts == 0`；若替换失败、启动崩溃、发生重启或无法确认健康状态，自动回滚旧版并恢复服务，避免更新导致节点失联。
          - **面板脚本新增旧版镜像清理**：`panel_install.sh` 菜单新增「5. 清理旧版镜像」、CLI 新增 `panel_install.sh cleanup`，更新完成后支持交互确认或 `PANEL_CLEANUP_OLD_IMAGES=1` 自动清理；仅清理未在使用的严格更低版本及悬空 FluxChain 镜像，保留当前版本、更高版本、`latest` 等非版本标签、正在使用的镜像及全部数据卷，且 Docker 查询失败时立即中止。
          - **节点与面板通信支持 `https://` / `wss://` 与请求头鉴权**：支持在面板「网站配置」填写 `https://域名`（反向代理自动使用 `wss://` 与 `https://`）；节点与面板默认通过 `X-Node-Secret` 请求头鉴权，避免密钥出现在 URL 与日志中，同时保留对旧版面板的显式兼容选项（`config.json` 中 `"legacy_query_secret": true` 或环境变量 `FLUXCHAIN_LEGACY_QUERY_SECRET=1`，仅限非 TLS），并限制跨站/降级/非 307·308 重定向且对异常日志脱敏。
          - **前端路由懒加载与按需拆包**：页面路由与布局改为 `React.lazy` 按需加载，图表依赖（Recharts/D3）仅在仪表盘页面加载，显著降低登录页首屏体积。

          体验本预发布版：
          - 面板安装/更新：请直接下载本 Release 附件中的 `panel_install.sh`（不要使用 `main` 分支链接）。
          - 节点更新：在节点执行 `curl -fL --retry 2 https://github.com/Toto0912/flux-chain/releases/download/v1.1.7-rc.1/install.sh -o install.sh && sudo bash ./install.sh -u`。
          EOF
          )
          release_notes+=$'\n\n'"[安装与更新说明](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/README.md)"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "FluxChain v$version" --notes "$release_notes"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          if [[ "$version" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --notes "$release_notes" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --notes "$release_notes" --draft=false --prerelease=false --latest
          fi
